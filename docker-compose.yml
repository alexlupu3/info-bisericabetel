# ─── Docker Compose: local DEV database — info.bisericabetel ────────────────
#
# Local use only. Production runs on CapRover (see docs/architecture/deployment.md).
# The production-like local staging stack lives in docker-compose.staging.yml.
#
# Dev runs the API and Vite natively with live reload; only PostgreSQL is here:
#   cp example.env .env          # set JWT_SECRET, DB_PASSWORD, DATABASE_URL
#   pnpm dev:db                  # = docker compose up -d db → 127.0.0.1:${DB_HOST_PORT:-5432}
#   pnpm seed:dev                # optional: replace the dev DB + uploads with a copy of live
#   pnpm dev:api & pnpm dev      # API on :3100 (tsx watch), app on :5173 (Vite HMR)
#
# Variables read from .env (full reference: docs/architecture/configuration.md):
#   DB_PASSWORD   required — password for the dev database
#   DB_HOST_PORT  optional — host port for PostgreSQL (default 5432)
# ─────────────────────────────────────────────────────────────────────────────

name: betel-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: info_bisericabetel
      POSTGRES_USER: betel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betel -d info_bisericabetel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
