server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ── API reverse proxy ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://${API_HOST}:3100/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # ── Admin SPA (Vite base path: /admin/) ───────────────────────────────────
    # Redirect /admin → /admin/ so the trailing-slash location block matches.
    location = /admin {
        return 301 /admin/;
    }

    # Files live under /var/www/admin/ and Nginx resolves them via root /var/www.
    location /admin/ {
        root /var/www;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── PWA SPA ───────────────────────────────────────────────────────────────
    location / {
        root /var/www/pwa;
        try_files $uri $uri/ /index.html;
    }
}
